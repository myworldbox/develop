<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    >
    <title>Campus Async - Flutter Web</title>
    <style>
      :root {
        color-scheme: light;
        background: #f6f8fc;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #f6f8fc;
        overscroll-behavior: none;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      flutter-view,
      flt-glass-pane,
      flt-scene-host,
      #flt-glass-pane {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background: inherit;
      }

      @supports (-webkit-touch-callout: none) {
        html,
        body,
        flutter-view,
        flt-glass-pane,
        flt-scene-host,
        #flt-glass-pane {
          min-height: -webkit-fill-available;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Register service worker for caching API and static assets (if supported)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service_worker.js').catch(function(err) {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
    <script src="main.dart.js"></script>
  </body>
</html>
